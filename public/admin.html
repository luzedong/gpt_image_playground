<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>IMAGE · 运营看板</title>
    <style>
      :root {
        --bg: #0b0f14;
        --panel: #121820;
        --panel2: #0f141b;
        --line: #223042;
        --text: #e6ebf2;
        --muted: #8b98a9;
        --accent: #4f8cff;
        --ok: #31c48d;
        --err: #f05252;
        --warn: #f6b93b;
      }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 24px; font: 13px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); }
      h1 { font-size: 17px; margin: 0; letter-spacing: .2px; }
      .muted { color: var(--muted); font-size: 12px; }
      .mono { font-variant-numeric: tabular-nums; }
      header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
      .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 14px 0 18px; }
      input, button { font: inherit; padding: 8px 11px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel); color: var(--text); }
      input { min-width: 240px; }
      button { cursor: pointer; transition: background .15s, border-color .15s; }
      button:hover { background: #182230; }
      button.active { border-color: var(--accent); color: var(--accent); background: rgba(79,140,255,.12); }
      .wrap { max-width: 1080px; margin: 0 auto; }
      .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 10px; margin-bottom: 16px; }
      .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 13px; }
      .card .k { color: var(--muted); font-size: 12px; }
      .card .v { font-size: 20px; font-weight: 600; margin-top: 3px; }
      .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 13px; padding: 15px; margin-bottom: 14px; }
      .panel h2 { font-size: 12px; margin: 0 0 11px; color: var(--muted); font-weight: 500; letter-spacing: .3px; text-transform: uppercase; }
      .bars { display: flex; align-items: flex-end; gap: 4px; height: 130px; padding-top: 4px; }
      .bars .col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: stretch; gap: 3px; min-width: 0; }
      .bars .col .b { background: linear-gradient(180deg, #64a1ff, #4f8cff); border-radius: 4px 4px 2px 2px; min-height: 2px; }
      .bars .col .e { background: var(--err); border-radius: 2px; min-height: 3px; }
      .bars .col span { font-size: 10px; color: var(--muted); text-align: center; margin-top: 5px; white-space: nowrap; }
      table { width: 100%; border-collapse: collapse; font-size: 12px; }
      th, td { text-align: left; padding: 8px 9px; border-bottom: 1px solid var(--line); }
      th { color: var(--muted); font-weight: 500; }
      tr:last-child td { border-bottom: 0; }
      tbody tr:hover { background: rgba(255,255,255,.02); }
      .pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; font-size: 11px; }
      .pill.ok { background: rgba(49,196,141,.14); color: var(--ok); }
      .pill.err { background: rgba(240,82,82,.14); color: var(--err); }
      .pill.unknown { background: rgba(246,185,59,.14); color: var(--warn); }
      .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      .id { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; color: var(--muted); }
      @media (max-width: 760px) { .grid2 { grid-template-columns: 1fr; } input { min-width: 0; flex: 1; } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div>
          <h1>IMAGE · 运营看板</h1>
          <div class="muted" id="status">需要访问令牌</div>
        </div>
        <div class="bar" style="margin:0">
          <input id="token" type="password" placeholder="ADMIN_TOKEN" />
          <button id="load">加载</button>
          <button data-range="24h" class="range active">24 小时</button>
          <button data-range="7d" class="range">7 天</button>
          <button data-range="30d" class="range">30 天</button>
          <button id="refresh">刷新</button>
        </div>
      </header>

      <div class="cards" id="cards"></div>

      <div class="panel">
        <h2>最近 10 条任务</h2>
        <table id="recent"></table>
      </div>

      <div class="panel">
        <h2>生成趋势 · 蓝=生成 红=失败</h2>
        <div class="bars" id="bars"></div>
        <div class="muted" id="barsNote" style="margin-top:8px"></div>
      </div>

      <div class="grid2">
        <div class="panel"><h2>按模型 / 动作</h2><table id="models"></table></div>
        <div class="panel"><h2>失败原因 Top</h2><table id="errors"></table></div>
      </div>

      <div class="grid2">
        <div class="panel"><h2>耗时（秒）</h2><table id="latency"></table></div>
        <div class="panel"><h2>实时状态</h2><table id="live"></table></div>
      </div>
    </div>

    <script>
      const state = { range: localStorage.getItem('adminRange') || '24h' }
      const $ = (id) => document.getElementById(id)
      const token = () => $('token').value.trim() || localStorage.getItem('adminToken') || ''
      const sec = (ms) => ms == null ? '—' : (ms < 60000 ? (ms / 1000).toFixed(1) : (ms / 1000).toFixed(0)) + 's'
      const time = (iso) => new Date(iso).toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false })
      const bucketLabel = (iso) => {
        const d = new Date(iso)
        return state.range === '24h' ? d.getHours() + ':00' : (d.getMonth() + 1) + '/' + d.getDate()
      }
      $('token').value = localStorage.getItem('adminToken') || ''

      function rows(el, head, body) {
        el.innerHTML = '<thead><tr>' + head.map((h) => '<th>' + h + '</th>').join('') + '</tr></thead><tbody>'
          + body.map((r) => '<tr>' + r.map((c) => '<td>' + c + '</td>').join('') + '</tr>').join('') + '</tbody>'
      }

      function pill(outcome) {
        if (outcome === 'ok') return '<span class="pill ok">成功</span>'
        if (outcome === 'error') return '<span class="pill err">失败</span>'
        return '<span class="pill unknown">处理中</span>'
      }

      function render(data) {
        $('status').textContent = data.range + ' · 更新于 ' + time(data.generatedAt)
        const t = data.totals
        const l = data.latency
        $('cards').innerHTML = [
          ['任务数', t.tasks], ['成功率', t.successRate == null ? '—' : t.successRate + '%'], ['失败', t.failedTasks],
          ['生成图片', t.images], ['其中编辑', t.edits],
          ['端到端 p50', sec(l.taskTotalMs.p50)], ['端到端 p95', sec(l.taskTotalMs.p95)],
          ['上游 p95', sec(l.upstreamMs.p95)], ['Agent 首字 p95', sec(l.firstTokenMs.p95)],
          ['队列中', data.live.queued], ['运行中', data.live.running], ['并发上限', data.live.concurrency],
        ].map(([k, v]) => '<div class="card"><div class="k">' + k + '</div><div class="v mono">' + v + '</div></div>').join('')

        rows($('recent'), ['时间', '任务', '类型', '模型', '动作', '尺寸', '耗时', '状态', '说明'],
          (data.recent || []).map((r) => [
            time(new Date(r.ts).toISOString()),
            '<span class="id">' + String(r.taskId || '').slice(0, 10) + '</span>',
            r.kind === 'agent' ? 'Agent' : '图片',
            r.model || '—',
            r.action ? (r.action === 'edit' ? '编辑' : '生成') : '—',
            r.size && r.size !== 'auto' ? r.size : 'auto',
            sec(r.totalMs),
            pill(r.outcome),
            r.errorKind || (r.outcome === 'ok' ? '—' : '—'),
          ]))

        const max = Math.max(1, ...data.buckets.map((b) => b.images + 0))
        $('bars').innerHTML = data.buckets.map((b) => {
          const h = Math.round((b.images / max) * 100)
          const eh = b.errors ? Math.max(5, Math.round((b.errors / max) * 100)) : 0
          return '<div class="col" title="' + time(new Date(b.ts).toISOString()) + ' · 生成 ' + b.images + ' · 失败 ' + b.errors + ' · p95 ' + sec(b.p95Ms) + '">'
            + (eh ? '<div class="e" style="height:' + eh + '%"></div>' : '')
            + '<div class="b" style="height:' + Math.max(2, h) + '%"></div>'
            + '<span>' + bucketLabel(b.ts) + '</span></div>'
        }).join('')
        $('barsNote').textContent = data.buckets.length
          ? '共 ' + data.buckets.length + ' 个时间桶，峰值 ' + max + ' 张'
          : (t.tasks === 0 ? '该区间没有任务记录。事件从本次部署开始采集，历史任务已在服务端首次启动时回填一次。' : '该区间没有时间桶')

        rows($('models'), ['模型 · 动作', '数量', 'p50', 'p95'],
          data.byModel.map((m) => [m.key, m.count, sec(m.p50Ms), sec(m.p95Ms)]))
        rows($('errors'), ['原因', '次数'], data.errors.map((e) => [e.key, e.count]))
        rows($('latency'), ['指标', '样本', '平均', 'p50', 'p90', 'p95', '最大'], [
          ['端到端', l.taskTotalMs], ['排队', l.queueMs], ['上游请求', l.upstreamMs],
          ['图片总计', l.imageTotalMs], ['Agent 首字', l.firstTokenMs],
        ].map(([k, s]) => [k, s.count, sec(s.avg), sec(s.p50), sec(s.p90), sec(s.p95), sec(s.max)]))
        rows($('live'), ['项', '值'], [
          ['并发上限 / 运行 / 排队', data.live.concurrency + ' / ' + data.live.running + ' / ' + data.live.queued],
          ['任务目录', data.live.taskDirMb + ' MB'], ['进程内存', data.live.rssMb + ' MB'],
          ['运行时长', Math.round(data.live.uptimeSec / 3600) + ' 小时'],
          ['模型覆盖', data.live.modelOverride || '未启用'], ['上游代理', data.live.proxy || '未启用'],
        ])
      }

      async function load() {
        const key = token()
        if (!key) { $('status').textContent = '请先填写 ADMIN_TOKEN'; return }
        localStorage.setItem('adminToken', key)
        $('status').textContent = '加载中…'
        try {
          const res = await fetch('/api-stats?range=' + state.range, { headers: { 'x-admin-token': key }, cache: 'no-store' })
          if (!res.ok) { $('status').textContent = res.status === 401 ? '令牌不正确' : '读取失败：HTTP ' + res.status; return }
          render(await res.json())
        } catch (err) {
          $('status').textContent = '请求失败：' + err.message
        }
      }

      $('load').onclick = load
      $('refresh').onclick = load
      document.querySelectorAll('.range').forEach((btn) => {
        btn.onclick = () => {
          document.querySelectorAll('.range').forEach((b) => b.classList.remove('active'))
          btn.classList.add('active')
          state.range = btn.dataset.range
          localStorage.setItem('adminRange', state.range)
          load()
        }
      })
      if (token()) load()
    </script>
  </body>
</html>
